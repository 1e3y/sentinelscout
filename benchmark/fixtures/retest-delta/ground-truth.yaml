    hostname: staging.bench.example
    candidate_type: staging_dev_exposed
    expected: present
    desirable: true
    validation: supported
not_candidates:
  - hostname: bench.example
    candidate_type: staging_dev_exposed
  - hostname: www.bench.example
    candidate_type: staging_dev_exposed
  - hostname: www.bench.example
    candidate_type: exposed_admin_interface
overlaps: []
known_misses: []
retest:
  - candidate_id: staging-exposed
    hostname: staging.bench.example
    candidate_type: staging_dev_exposed
    after: staging_down
    expected_retest_status: passed
