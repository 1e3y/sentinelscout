schema_version: 1
fixture_id: retest-delta
scope:
  root: bench.example
  include_subdomains: true
  exclusions: []
default_response_headers:
  Strict-Transport-Security: max-age=31536000
sites:
  - hostname: bench.example
    path: /
    html: bench.example/index.html
  - hostname: www.bench.example
    path: /
    html: www.bench.example/index.html
  - hostname: staging.bench.example
    path: /
    html: staging.bench.example/index.html
assets:
  - hostname: bench.example
    reachable: true
  - hostname: www.bench.example
    reachable: true
  - hostname: staging.bench.example
    reachable: true
candidates:
