# Loopback-only fixture HTTP. No public ports required beyond localhost.
# Prefer `python -m app.benchmark serve` for CI; Compose is optional local parity.
services:
  fixtures:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./fixtures/html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18080/"]
      interval: 2s
      timeout: 2s
      retries: 10
